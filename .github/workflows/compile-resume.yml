name: Compile Resume PDF

on:
  push:
    branches: [main]
    paths:
      - "resume/cv-vinicius-gobbi.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        with:
          root_file: cv-vinicius-gobbi.tex
          working_directory: resume

      - name: Copy PDF to Angular public assets
        run: cp resume/cv-vinicius-gobbi.pdf public/assets/cv-vinicius-gobbi.pdf

      - name: Commit compiled PDF
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: recompilar currículo em PDF"
          file_pattern: >-
            resume/cv-vinicius-gobbi.pdf
            resume/cv-vinicius-gobbi.aux
            resume/cv-vinicius-gobbi.log
            resume/cv-vinicius-gobbi.out
            public/assets/cv-vinicius-gobbi.pdf
